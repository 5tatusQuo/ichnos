[project]
name = "ichnos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "5tatusQuo", email = "isuquo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ichnos = "ichnos:main"

[build-system]
